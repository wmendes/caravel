# Caravel Perps testnet lane, lane #1 (spec §10.3, DEC-054).
# `caravel-perps-node genesis` turns this into GenesisConfigV1 and prints
# config_hash and genesis_state_hash. The generic sections are the platform's;
# the perps settings are under [perps.*]. Only public keys live here; the
# secrets are in the operator's Stellar CLI keystore (identities
# caravel-backstop, caravel-treasury, caravel-oracle).

[lane]
name = "caravel-perps-testnet-0"          # lane_id = H("CARAVEL/LANE/V1" || name)

[app]
template = "perps"                         # the app this lane runs (DEC-054)
engine_wasm_sha256 = "4571cd252d4b78d523d01fc4a31ab763a1aff77aecafbb9d7302cfb879abbf0a"   # the perps engine of record; nodes refuse another

[node]                                     # not consensus
block_time_ms = 1000                       # allowed 200..=5000
checkpoint_every_blocks = 60                # one checkpoint a minute on testnet (DEC-044)
max_batch_bytes = 96000

[access]
mode = "open"                              # "open" | "allowlist"
allowlist = []

[limits]                                   # the platform's limits
min_deposit = 10000000                     # 1 USDC (the settlement contract also enforces its own min, §13.1)
min_withdrawal = 10000000
max_accounts = 256                         # caps from the T-005 benchmark (DEC-028)
max_session_keys = 4
max_txs_per_account_per_block = 50
max_entries_per_block = 256                # all entry types together
max_block_bytes = 12000                    # ~56 PLACE_ORDER txs; see §3.3
max_pending_withdrawals = 512
exec_cpu_limit = 200000000                 # T-005: worst block at these caps is 95.8M host insns
exec_mem_limit = 41943040

[perps.accounts]
backstop_key = "GAG5OK7U7GLFB2BQWIZPNSPVOTITXV3AJBQAHZJWT6RFABBONNLJES7U"   # system account 0 (insurance fund + liquidation backstop)
treasury_key = "GBGZLTDH3T33BURHR5DHC7STUI5EGCAYJTJZNYF3U6BCGDG4VXP3MAWC"   # system account 1 (fees)

[perps.oracle]
keys = ["GCRDC7NQMHX62P5T4OU64VDGKYXP5YSUXTO3IUNIVTT5XNMEZV4XH37Q"]
max_staleness_ms = 30000
max_future_ms = 5000
circuit_breaker_bps = 1000                 # 10% base move allowed per update ...
breaker_bps_per_sec = 10                   # ... plus 0.1% per second since the last accepted update

[perps.funding]
interval_ms = 3600000
damping = 8
max_rate_ppm = 500                         # 0.05% per interval

[perps.fees]
insurance_share_bps = 3000                 # 30% of every fee to backstop, rest to treasury

[perps.limits]                             # the order book's
max_orders_per_side = 128
max_open_orders_per_account = 32

[[perps.markets]]
market_id = 1
symbol = "BTC-PERP"
display_lot_base_units = 10000             # 1 lot = 0.0001 BTC (base decimals 8)
display_base_decimals = 8
tick = 1000                                # 0.0001 USDC per lot = $1 per BTC
imf_bps = 1000                             # 10x max
mmf_bps = 500
taker_fee_bps = 5
maker_fee_bps = 0
liq_fee_bps = 100
band_bps = 500
max_position_lots = 20000                  # 2 BTC
max_oi_lots = 200000                       # 20 BTC
impact_lots = 1000                         # 0.1 BTC of depth for the funding premium

[[perps.markets]]
market_id = 2
symbol = "ETH-PERP"
display_lot_base_units = 100000            # 1 lot = 0.001 ETH (base decimals 8)
display_base_decimals = 8
tick = 1000                                # $0.10 per ETH
imf_bps = 1000
mmf_bps = 500
taker_fee_bps = 5
maker_fee_bps = 0
liq_fee_bps = 100
band_bps = 500
max_position_lots = 50000
max_oi_lots = 500000
impact_lots = 2000                         # 2 ETH

[[perps.markets]]
market_id = 3
symbol = "XLM-PERP"
display_lot_base_units = 100000000         # 1 lot = 10 XLM (base decimals 7)
display_base_decimals = 7
tick = 1000                                # $0.00001 per XLM
imf_bps = 2000                             # 5x max
mmf_bps = 1000
taker_fee_bps = 5
maker_fee_bps = 0
liq_fee_bps = 100
band_bps = 500
max_position_lots = 100000
max_oi_lots = 1000000
impact_lots = 1000                         # 10,000 XLM

# Lane #1's deployment (M0.5 P-16): the contract deployed by
# scripts/deploy-testnet.sh on 2026-09-29 and the VM caravel-1, now run by
# `caravel plan|apply|status lanes/perps/config/lane.caravel-perps.testnet.toml --env testnet`.
# Keys are identities in the operator's Stellar keystore; none is written here.
[env.testnet]
network = "testnet"
admin = "caravel-admin"
token = "circle-usdc"                      # the settlement token: Circle's testnet USDC
settlement = "CBIHBEUZYFZQZEQPBJH2ID6CDRDZFEDI6XHAXVOCHG6FO5XWUIGPONWO"   # deployed before the tool, with a random salt
settlement_wasm = "8a2fafbd1ad48d53333ab79d73afa1c50d5f790f39a97fafb88b5443b383d503"   # lane #1's build (DEC-061)
threshold = 2

[env.testnet.settlement_params]
force_inclusion_window_secs = 3600
escape_timeout_secs = 21600
min_rotation_delay_secs = 3600
signer_retention_epochs = 2

[[env.testnet.validators]]
name = "1"
key = "caravel-validator-1"

[[env.testnet.validators]]
name = "2"
key = "caravel-validator-2"

[[env.testnet.validators]]
name = "3"
key = "caravel-validator-3"

[env.testnet.sequencer]
port = 8080
production = true

[env.testnet.validator_polling]
sequencer_ms = 200
stellar_secs = 30

[env.testnet.relayer]
account = "caravel-relayer"
feed_keys = { CARAVEL_ORACLE_SECRET = "caravel-oracle" }
intervals_ms = { inbox = 3000, checkpoints = 2000 }

# The perps oracle (DEC-058): Coinbase's WebSocket first, then its REST spot, then Reflector.
[[env.testnet.relayer.feeds]]
module = "relayer-feeds/perps/dist/index.js"
intervalMs = 1000

[env.testnet.relayer.feeds.options]
maxSourceAgeSecs = 900
reflectorContract = "CCYOZJCOPG34LLQQ7N24YXBM7LL62R7ONMZ3G6WZAAYPB5OYKOMJRN63"

[env.testnet.relayer.feeds.options.markets]
"1" = [{ coinbaseStream = "BTC-USD" }, { coinbase = "BTC-USD" }, { reflector = "BTC" }]
"2" = [{ coinbaseStream = "ETH-USD" }, { coinbase = "ETH-USD" }, { reflector = "ETH" }]
"3" = [{ coinbaseStream = "XLM-USD" }, { coinbase = "XLM-USD" }, { reflector = "XLM" }]

[env.testnet.host]
provider = "ssh"
transport = "gcloud-iap"
address = "caravel-1"
project = "caravel-testnet"
zone = "us-central1-a"
public_url = "https://35-224-76-64.sslip.io"
