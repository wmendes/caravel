# Validator node config for a LOCAL lane (not consensus; spec §15). Paths are
# relative to this file. The secret key lives in key_file (an S... strkey,
# e.g. from `stellar keys generate caravel-validator-1 && stellar keys show
# caravel-validator-1`); *.key and /keys/ are ignored by git.
#
#   cargo run --release -p caravel-perps-node -- validator --config lanes/perps/config/validator-1.local.toml

[validator]
listen = "127.0.0.1:8081"
sequencer_url = "http://127.0.0.1:8080"
key_file = "../../../keys/validator-1.key"
lane = "lane.caravel-perps.local.toml"
engine_wasm = "../../../target/contracts/perps_engine.wasm"
engine_wasm_sha256 = "4571cd252d4b78d523d01fc4a31ab763a1aff77aecafbb9d7302cfb879abbf0a"
db = "../../../data/validator-1.sqlite"
network_passphrase = "Test SDF Network ; September 2015"
settlement_contract = "CADQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQP5KR"
# Stellar RPC, to learn which checkpoint the contract accepted (needed for /v1/proofs/escape).
# rpc_url = "http://127.0.0.1:8000/rpc"
poll_ms = 200
stellar_poll_secs = 10
