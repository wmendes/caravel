# Generated by caravel ([env.testnet], host default): the lane's nodes as containers (DEC-112).
# caravel apply runs it; caravel logs, status and destroy read it.
name: "caravel-perps-testnet-0-testnet"
services:
  sequencer:
    image: "ghcr.io/wmendes/caravel-perps-node@sha256:1111111111111111111111111111111111111111111111111111111111111111"
    command: ["sequencer", "--config", "/opt/caravel/config/sequencer.toml"]
    env_file: ["/opt/caravel/keys/env"]
    environment: { RUST_LOG: info }
    volumes:
      - "/opt/caravel/config:/opt/caravel/config:ro"
      - "/opt/caravel/data:/opt/caravel/data"
    ports: ["127.0.0.1:8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    user: "${CARAVEL_UID:-10001}:${CARAVEL_GID:-10001}"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    labels: { caravel.lane: "caravel-perps-testnet-0", caravel.env: "testnet", caravel.node: "sequencer" }
  validator-1:
    image: "ghcr.io/wmendes/caravel-perps-node@sha256:1111111111111111111111111111111111111111111111111111111111111111"
    command: ["validator", "--config", "/opt/caravel/config/validator-1.toml"]
    environment: { RUST_LOG: info }
    volumes:
