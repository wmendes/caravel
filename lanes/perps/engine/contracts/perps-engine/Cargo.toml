[package]
name = "perps-engine"
description = "Caravel Perps engine contract: thin Soroban wrapper around caravel-perps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
caravel-perps = { workspace = true }
caravel-types = { workspace = true }
# The engine allocates (state and blocks are variable-length); the SDK's
# bump allocator serves it.
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
caravel-perps = { workspace = true, features = ["native"] }
caravel-testkit = { workspace = true }
