# FROZEN (M0.5, DEC-051): the Caravel Perps engine of record. Do not edit
# anything under lanes/perps/engine/. The deployed lane's settlement contract
# stores this engine's Wasm hash (4571cd25…), and scripts/check-frozen.sh pins
# this directory's git tree. This workspace keeps the M0 root workspace's
# layout, manifest and lock subgraph so `stellar contract build` gives the same
# bytes. The root workspace excludes it and uses its crates by path.
[workspace]
resolver = "2"
members = ["crates/*", "contracts/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

# Pins must match versions.json (checked by scripts/check-versions.mjs).
# stellar-xdr and stellar-strkey follow what soroban-env-host 28.0.2 and soroban-sdk 28.0.0 require (DEC-018).
[workspace.dependencies]
soroban-sdk = { version = "=28.0.0" }
soroban-env-host = { version = "=28.0.2" }
stellar-xdr = { version = "=28.0.0", default-features = false }
stellar-strkey = { version = "=0.0.16" }
ed25519-dalek = { version = "=2.2.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

caravel-types = { path = "crates/caravel-types" }
caravel-merkle = { path = "crates/caravel-merkle" }
caravel-perps = { path = "crates/caravel-perps" }
caravel-testkit = { path = "crates/caravel-testkit" }

# §12.3: reproducible contract builds. opt-level 2, not "z": the engine runs
# interpreted inside soroban-env-host, where "z" (no inlining) made decoding
# 4.6x and margin scans 2.7x more expensive for 20 KB of size (DEC-027).
[profile.release]
opt-level = 2
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Fast crypto in debug test builds; our own crates stay unoptimized.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
# The Wasm interpreter and host run tens of thousands of blocks in tests.
[profile.dev.package.soroban-env-host]
opt-level = 3
[profile.dev.package.soroban-env-common]
opt-level = 3
[profile.dev.package.soroban-wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmparser-nostd]
opt-level = 3
[profile.dev.package.stellar-xdr]
opt-level = 3
