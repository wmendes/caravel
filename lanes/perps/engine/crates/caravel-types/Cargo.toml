[package]
name = "caravel-types"
description = "Caravel binary encodings, domain tags, reason and fatal codes, fixed-point helpers (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables `vectors`, the golden-vector builders (spec §19.2) used by
# `cargo gen-vectors` in caravel-testkit. They need a hasher and a signer; the
# library itself never hashes or signs.
gen-vectors = ["dep:sha2", "dep:ed25519-dalek"]

[dependencies]
sha2 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
proptest = "1.11.0"
