[package]
name = "payments-engine"
description = "Caravel Payments engine contract: thin Soroban wrapper around caravel-payments on the app SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
caravel-app-sdk = { workspace = true }
caravel-core = { workspace = true }
caravel-payments = { workspace = true }
# The engine allocates (state and blocks are variable-length); the SDK's
# bump allocator serves it.
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
sha2 = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
