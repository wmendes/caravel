# LOCAL-ONLY Payments lane for development and scripts/e2e-local.sh
# (E2E_TEMPLATE=payments). The treasury key is a public test fixture (seed
# [0x22; 32]), whose secret is in the source. Never use this lane on testnet.

[lane]
name = "caravel-payments-local-0"          # lane_id = H("CARAVEL/LANE/V1" || name)

[app]
template = "payments"                      # the app this lane runs (DEC-054)
engine_wasm_sha256 = "f83849633a65b63104673359fca2643b1e5ca5d4208b58d88aedccb01a72b29d"   # the payments engine of record (versions.json lanes.payments)

[node]                                     # not consensus
block_time_ms = 1000                       # allowed 200..=5000
checkpoint_every_blocks = 10
max_batch_bytes = 96000

[access]
mode = "open"                              # "open" | "allowlist"
allowlist = []

[limits]                                   # the platform's limits
min_deposit = 10000000                     # 1 USDC
min_withdrawal = 10000000
max_accounts = 256
max_session_keys = 4
max_txs_per_account_per_block = 50
max_entries_per_block = 256
max_block_bytes = 12000
max_pending_withdrawals = 512
exec_cpu_limit = 200000000
exec_mem_limit = 41943040

[payments]
treasury_key = "GCQJVJPUPJTVTABP7FK7RXBNFIKKLSM5EO7JP6DECJ77SOBUKWSPB64N"   # system account 0: receives the fees
transfer_fee = 100000                      # 0.01 USDC per transfer, paid by the sender
min_transfer = 1                           # 1 stroop
