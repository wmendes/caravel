# A Payments lane: accounts deposit a token, pay each other on the lane for a
# fee, and withdraw back to Stellar. `caravel init payments` wrote this file
# and created the Stellar CLI identities it names.
#
# Everything above [env.*] is the lane's genesis: it fixes the lane's id and
# its config hash, so it can't change once the lane is deployed. Edit it
# before the first `caravel apply`.

[lane]
name = "{{name}}"                          # lane_id = H("CARAVEL/LANE/V1" || name)

[app]
template = "payments"
engine_wasm_sha256 = "f83849633a65b63104673359fca2643b1e5ca5d4208b58d88aedccb01a72b29d"   # the payments engine of record

[node]                                     # not consensus
block_time_ms = 1000                       # allowed 200..=5000
checkpoint_every_blocks = 60               # a cap; the times below decide (§14.2 d-f)
checkpoint_urgent_ms = 2000                # deposits and withdrawals
checkpoint_busy_ms = 10000                 # user transactions
checkpoint_idle_ms = 15000                 # anything; at most half the local escape timeout below
max_batch_bytes = 96000

[access]
mode = "open"                              # "open" | "allowlist"
allowlist = []

[limits]
min_deposit = 10000000                     # 1 token (7 decimals)
min_withdrawal = 10000000
max_accounts = 256
max_session_keys = 4
max_txs_per_account_per_block = 50
max_entries_per_block = 256
max_block_bytes = 12000
max_pending_withdrawals = 512
exec_cpu_limit = 200000000
exec_mem_limit = 41943040

[payments]
treasury_key = "{{g.treasury}}"            # identity {{id.treasury}}: receives the fees
transfer_fee = 100000                      # 0.01 per transfer, paid by the sender
min_transfer = 1

# A deployment on this machine, against a local Stellar network that
# `caravel apply` starts. Keys are Stellar CLI identities, never secrets.
[env.local]
default = true                             # what commands use when --env is not given
network = "local"
admin = "{{id.admin}}"                     # deploys the settlement contract, issues the test token
token = { local = "USDC" }                 # a test asset USDC:<admin>
threshold = 2

[env.local.settlement_params]
force_inclusion_window_secs = 20           # short, for a local lane
escape_timeout_secs = 30
min_rotation_delay_secs = 3600
signer_retention_epochs = 2

[[env.local.validators]]
name = "1"
key = "{{id.v1}}"

[[env.local.validators]]
name = "2"
key = "{{id.v2}}"

[[env.local.validators]]
name = "3"
key = "{{id.v3}}"

[env.local.sequencer]
port = {{port}}                            # validators listen on port + 1, + 2, + 3

[env.local.validator_polling]
stellar_secs = 2

[env.local.relayer]
account = "{{id.relayer}}"
intervals_ms = { inbox = 1000, checkpoints = 1000 }

[env.local.host]
provider = "local"
