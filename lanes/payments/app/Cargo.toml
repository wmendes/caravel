[package]
name = "caravel-payments"
description = "Caravel Payments engine logic: USDC transfers on the app SDK (template payments 0.1.0, no_std)"
# Built into a contract of record: its version stays put when the workspace
# version moves, because on x86_64 Linux a version change can reorder the
# Wasm (DEC-033, DEC-122). It changes with the contract.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
native = ["caravel-app-sdk/native"]

[dependencies]
caravel-app-sdk = { workspace = true }
caravel-core = { workspace = true }
