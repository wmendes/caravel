# Spec §19.1 gates, plus the versions.json check (§7).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run on a pull request; on main every merge
# gets a finished run (F-04).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must match versions.json "stellar_cli"; the digest is GitHub's published sha256 for the asset.
  STELLAR_CLI_VERSION: "28.1.0"
  STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"
  # Must match versions.json "opentofu"; the digest is from the release's SHA256SUMS.
  TOFU_VERSION: "1.13.1"
  TOFU_SHA256: "378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69"
  # Must match versions.json "nextest".
  NEXTEST_VERSION: "0.9.146"
  # Tests need no debug info, and it doubles link time and disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # What a change can affect (DEC-117), so a docs-only change doesn't wait for
  # the Rust build, the e2e or the release. When in doubt, a file is code.
  # `[skip ci]` in a commit message skips this workflow altogether
  # (CONTRIBUTING.md says when).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      apps: ${{ steps.diff.outputs.apps }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all='["platform/relayer","lanes/perps/relayer-feeds","lanes/perps/web","docs-site"]'
          # Main runs everything: when several merges land together, GitHub
          # drops the queued runs between them, so a diff from the last push
          # would skip code that never ran on main (F-15).
          if [[ "$EVENT" == pull_request ]]; then
            files="$(git diff --name-only "$BASE...$HEAD")"
          else
            { echo "code=true"; echo "apps=$all"; echo "infra=true"; } >> "$GITHUB_OUTPUT"
            echo "everything ($EVENT)"; exit 0
          fi
          echo "$files"
          code=false; infra=false; apps=()
          has() { grep -qE "$1" <<< "$files"; }
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            case "$f" in
              lanes/perps/engine/*) code=true ;;
              # Not code for the Rust build and e2e; docs-site and infra have jobs of their own.
              docs/* | docs-site/* | site/* | infra/opentofu/* | .claude/* | LICENSE* | *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          if has '^(versions\.json|\.github/workflows/ci\.yml)$'; then
            apps_json="$all"; infra=true
          else
            for a in platform/relayer lanes/perps/relayer-feeds lanes/perps/web docs-site; do
              if has "^$a/"; then apps+=("$a"); fi
            done
            # The feed module runs inside the relayer: test it with the relayer.
            if has '^platform/relayer/' && ! has '^lanes/perps/relayer-feeds/'; then apps+=(lanes/perps/relayer-feeds); fi
            apps_json="$(printf '%s\n' "${apps[@]}" | jq -Rnc '[inputs | select(length > 0)]')"
            if has '^infra/opentofu/'; then infra=true; fi
          fi
          { echo "code=$code"; echo "apps=$apps_json"; echo "infra=$infra"; } >> "$GITHUB_OUTPUT"
          echo "code=$code apps=$apps_json infra=$infra"

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-versions.mjs
      # DEC-051: the perps engine of record is frozen under lanes/perps/engine.
      - run: ./scripts/check-frozen.sh
      # M0.5: nothing under platform/ may depend on a lane (listed exceptions shrink to none).
      - run: node scripts/check-deps.mjs
      # The e2e drives a lane with the caravel CLI alone (C-14).
      - run: ./scripts/check-e2e.sh
      # Copy rule (spec §20.3): one well-known IaC tool is never named in the
      # repo. The pattern avoids spelling the word, so it doesn't match itself.
      # OpenTofu's own syntax and file names need it, so infra/opentofu is
      # exempt (DEC-114); its docs and comments still follow the rule.
      - name: Copy rule
        run: "! git grep -I -n -i -E 'terra[f]orm' -- . ':!infra/opentofu'"
      # The docs site's copy: honest claims, no em dashes (H-12).
      - run: ./scripts/check-docs.sh

  # Machines as code (M0.8, D-04): every OpenTofu root and module is formatted
  # and valid, offline (no backend, no cloud credentials).
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenTofu
        run: |
          curl -sSfL -o tofu.tar.gz \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          echo "${TOFU_SHA256}  tofu.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf tofu.tar.gz -C "$HOME/.local/bin" tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tofu fmt -check -recursive -diff infra/opentofu
      - name: Validate
        run: |
          for d in infra/opentofu/envs/* infra/opentofu/modules/*; do
            echo "== $d"
            if [[ "$d" == */envs/* ]]; then lock=-lockfile=readonly; else lock=; fi
            tofu -chdir="$d" init -backend=false -input=false $lock > /dev/null
            tofu -chdir="$d" validate
          done
      - run: for f in infra/opentofu/modules/caravel-host-gcp/startup.sh infra/opentofu/bootstrap-state.sh; do bash -n "$f"; done

  # The Rust gates, split into four jobs that run side by side (F-04). Each
  # restores the cargo cache of both workspaces that main saved.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The frozen perps engine workspace (DEC-051): checked, never reformatted.
      - run: cargo fmt --all --manifest-path lanes/perps/engine/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --manifest-path lanes/perps/engine/Cargo.toml -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
          stellar-cli: "true"
          nextest: "true"
      - run: stellar --version
      # The tests load the Wasm of record, so build it first. This also checks
      # sizes and that the hashes match versions.json (INV-D7).
      - run: ./scripts/build-contracts.sh
      # The Wasm of record comes from this x86_64 Linux build (DEC-033): deploys
      # take these files, and they are kept for diffing when a hash differs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-wasm
          path: target/contracts/*.wasm
          if-no-files-found: ignore
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --locked --doc
      # The docs site's CLI reference is generated from `caravel help` (H-12).
      - name: The CLI reference matches the CLI
        run: cargo build --locked -p caravel-cli && CARAVEL_BIN=target/debug/caravel ./scripts/check-cli-docs.sh
      - name: Consensus crates build without std
        run: |
          cargo build --locked --manifest-path lanes/perps/engine/Cargo.toml -p caravel-types -p caravel-merkle -p caravel-perps --target wasm32v1-none
          cargo build --locked -p caravel-core -p caravel-app-sdk -p caravel-payments --target wasm32v1-none

  engine:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: engine
          nextest: "true"
      - name: Frozen perps engine tests (vectors, scenarios, properties)
        run: |
          cargo nextest run --workspace --locked --manifest-path lanes/perps/engine/Cargo.toml
          cargo test --workspace --locked --doc --manifest-path lanes/perps/engine/Cargo.toml

  # INV-P5: 10,000 random blocks through the native build and the Wasm, both
  # templates at once (nextest runs the two gates in parallel processes; the
  # perps gate also spreads its 50 lanes over every core).
  parity:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: test
          stellar-cli: "true"
          nextest: "true"
      - run: ./scripts/build-contracts.sh
      - name: Parity gates, 10,000 random blocks each (INV-P5)
        run: cargo nextest run --workspace --locked --run-ignored only -E 'binary(parity)' --no-capture

  apps:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm --prefix ${{ matrix.app }} ci
      - run: npm --prefix ${{ matrix.app }} test
      - if: matrix.app == 'lanes/perps/web'
        run: npm --prefix lanes/perps/web run build

  # The local end-to-end (spec §19.5, T-011): quickstart in Docker, the lane
  # processes, steps 1-6, for each template (P-10). It needs a release build
  # and a 2 GB image, so it runs on main and on demand only, not on every pull
  # request.
  e2e:
    needs: [changes, release]
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        template: [perps, payments]
        # Processes, and containers from the images the release job pushed (D-03).
        runtime: [process, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release
          stellar-cli: "true"
      # The release job's build, used as is (F-04): the e2e builds nothing.
      - uses: actions/download-artifact@v4
        with:
          name: caravel-release-linux-x86_64
          path: release
      - name: Restore the binaries' execute bits (artifacts drop them)
        run: chmod +x release/bin/*
      - run: ./scripts/e2e-local.sh
        env:
          E2E_TEMPLATE: ${{ matrix.template }}
          E2E_RUNTIME: ${{ matrix.runtime }}
          E2E_RELEASE_DIR: ${{ github.workspace }}/release

  # The README's quickstart, run as written after ./scripts/install.sh
  # (C-14, Gate G3): the same conditions as the e2e.
  quickstart:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release
          stellar-cli: "true"
      - run: ./scripts/check-quickstart.sh

  # What the testnet VM runs (T-012, DEC-046): the node binary, the Wasm of
  # record (x86_64 Linux, DEC-033) and the relayer build, from one commit on
  # main. The VM runs Ubuntu 24.04 like this runner, so glibc matches.
  release:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Pushes this commit's container images to GHCR (D-01, DEC-111).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
        with:
          cache-key: release
          stellar-cli: "true"
      - run: ./scripts/build-contracts.sh
      # Each node reports this commit in /v1/status (the deploy tool's host check).
      - run: cargo build --release --locked -p caravel-cli -p caravel-perps-node -p caravel-payments-node
        env:
          CARAVEL_COMMIT: ${{ github.sha }}
      - run: npm --prefix platform/relayer ci && npm --prefix platform/relayer run build
      - run: npm --prefix lanes/perps/relayer-feeds ci && npm --prefix lanes/perps/relayer-feeds run build
      - run: npm --prefix lanes/perps/web ci && npm --prefix lanes/perps/web run build
      # The same script assembles a local install (scripts/install.sh, DEC-076).
      - name: Assemble the release
        run: |
          ./scripts/assemble-release.sh release --commit "${GITHUB_SHA}"
          cat release/SHA256SUMS
      # The quickstart's install path, from the builds above.
      - name: Install it
        run: |
          ./scripts/install.sh --skip-build --no-modify-path --prefix "$RUNNER_TEMP/caravel"
          "$RUNNER_TEMP/caravel/bin/caravel" version
          # The runner's keystore has none of the lane's identities, so only the genesis is asserted.
          "$RUNNER_TEMP/caravel/bin/caravel" validate --json -f lanes/payments/config/lane.caravel-payments.local.toml > validate.json || true
          jq -e '.checks[] | select(.check == "genesis") | .ok' validate.json
      # The images of this release, pushed by digest; IMAGES lists them for
      # `caravel apply` with the docker runtime.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the images
        run: |
          ./scripts/build-images.sh amd64=release --push --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          node_image="$(awk '$1 == "perps-node" { print $2 }' release/IMAGES)"
          docker run --rm "$node_image" --version
          docker run --rm -v "$PWD/lanes/perps/config:/cfg:ro" "$node_image" genesis --config /cfg/lane.caravel-perps.testnet.toml | jq -e '.config_hash'
      - uses: actions/upload-artifact@v4
        with:
          name: caravel-release-linux-x86_64
          path: release/
