# Spec §19.1 gates, plus the versions.json check (§7).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match versions.json "stellar_cli"; the digest is GitHub's published sha256 for the asset.
  STELLAR_CLI_VERSION: "28.1.0"
  STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-versions.mjs
      # DEC-051: the perps engine of record is frozen under lanes/perps/engine.
      - run: ./scripts/check-frozen.sh
      # M0.5: nothing under platform/ may depend on a lane (listed exceptions shrink to none).
      - run: node scripts/check-deps.mjs
      # The e2e drives a lane with the caravel CLI alone (C-14).
      - run: ./scripts/check-e2e.sh
      # Copy rule (spec §20.3): one well-known IaC tool is never named in the
      # repo. The pattern avoids spelling the word, so it doesn't match itself.
      - name: Copy rule
        run: "! git grep -I -n -i -E 'terra[f]orm'"
      # The docs site's copy: honest claims, no em dashes (H-12).
      - run: ./scripts/check-docs.sh

  rust:
    runs-on: ubuntu-latest
    # Two workspaces (root and the frozen engine) build debug targets here, and
    # the runner's disk ran out linking caravel-perps-node (ld bus error). Tests
    # need no debug info; the Wasm builds use the release profile, unaffected.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space (preinstalled SDKs Caravel does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: stellar --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The frozen perps engine workspace (DEC-051): checked, never reformatted.
      - run: cargo fmt --all --manifest-path lanes/perps/engine/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --manifest-path lanes/perps/engine/Cargo.toml -- -D warnings
      # The parity tests load the Wasm of record, so build it first. This also
      # checks sizes and that the hashes match versions.json (INV-D7).
      - run: ./scripts/build-contracts.sh
      # The Wasm of record comes from this x86_64 Linux build (DEC-033): deploys
      # take these files, and they are kept for diffing when a hash differs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-wasm
          path: target/contracts/*.wasm
          if-no-files-found: ignore
      - run: cargo test --workspace --locked
      - name: Frozen perps engine tests (vectors, scenarios, properties)
        run: cargo test --workspace --locked --manifest-path lanes/perps/engine/Cargo.toml
      - name: Parity gate, 10,000 random blocks (INV-P5)
        run: |
          cargo test --locked -p caravel-perps-node --test parity -- --ignored
          cargo test --locked -p caravel-payments-node --test parity -- --ignored
      # The docs site's CLI reference is generated from `caravel help` (H-12).
      - name: The CLI reference matches the CLI
        run: cargo build --locked -p caravel-cli && CARAVEL_BIN=target/debug/caravel ./scripts/check-cli-docs.sh
      - name: Consensus crates build without std
        run: |
          cargo build --locked --manifest-path lanes/perps/engine/Cargo.toml -p caravel-types -p caravel-merkle -p caravel-perps --target wasm32v1-none
          cargo build --locked -p caravel-core -p caravel-app-sdk -p caravel-payments --target wasm32v1-none

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [platform/relayer, lanes/perps/relayer-feeds, lanes/perps/web, docs-site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm --prefix ${{ matrix.app }} ci
      - run: npm --prefix ${{ matrix.app }} test
      - if: matrix.app == 'lanes/perps/web'
        run: npm --prefix lanes/perps/web run build

  # The local end-to-end (spec §19.5, T-011): quickstart in Docker, the lane
  # processes, steps 1-6, for each template (P-10). It needs a release build
  # and a 2 GB image, so it runs on main and on demand only, not on every pull
  # request.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        template: [perps, payments]
        # Processes, and containers from images built here from the checkout (D-03).
        runtime: [process, docker]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/e2e-local.sh
        env:
          E2E_TEMPLATE: ${{ matrix.template }}
          E2E_RUNTIME: ${{ matrix.runtime }}

  # The README's quickstart, run as written after ./scripts/install.sh
  # (C-14, Gate G3): the same conditions as the e2e.
  quickstart:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/check-quickstart.sh

  # What the testnet VM runs (T-012, DEC-046): the node binary, the Wasm of
  # record (x86_64 Linux, DEC-033) and the relayer build, from one commit on
  # main. The VM runs Ubuntu 24.04 like this runner, so glibc matches.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Pushes this commit's container images to GHCR (D-01, DEC-111).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build-contracts.sh
      # Each node reports this commit in /v1/status (the deploy tool's host check).
      - run: cargo build --release --locked -p caravel-cli -p caravel-perps-node -p caravel-payments-node
        env:
          CARAVEL_COMMIT: ${{ github.sha }}
      - run: npm --prefix platform/relayer ci && npm --prefix platform/relayer run build
      - run: npm --prefix lanes/perps/relayer-feeds ci && npm --prefix lanes/perps/relayer-feeds run build
      - run: npm --prefix lanes/perps/web ci && npm --prefix lanes/perps/web run build
      # The same script assembles a local install (scripts/install.sh, DEC-076).
      - name: Assemble the release
        run: |
          ./scripts/assemble-release.sh release --commit "${GITHUB_SHA}"
          cat release/SHA256SUMS
      # The quickstart's install path, from the builds above.
      - name: Install it
        run: |
          ./scripts/install.sh --skip-build --prefix "$RUNNER_TEMP/caravel"
          "$RUNNER_TEMP/caravel/bin/caravel" version
          # The runner's keystore has none of the lane's identities, so only the genesis is asserted.
          "$RUNNER_TEMP/caravel/bin/caravel" validate --json -f lanes/payments/config/lane.caravel-payments.local.toml > validate.json || true
          jq -e '.checks[] | select(.check == "genesis") | .ok' validate.json
      # The images of this release, pushed by digest; IMAGES lists them for
      # `caravel apply` with the docker runtime.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the images
        run: |
          ./scripts/build-images.sh amd64=release --push --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          node_image="$(awk '$1 == "perps-node" { print $2 }' release/IMAGES)"
          docker run --rm "$node_image" --version
          docker run --rm -v "$PWD/lanes/perps/config:/cfg:ro" "$node_image" genesis --config /cfg/lane.caravel-perps.testnet.toml | jq -e '.config_hash'
      - uses: actions/upload-artifact@v4
        with:
          name: caravel-release-linux-x86_64
          path: release/
