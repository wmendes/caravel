# Spec §19.1 gates, plus the versions.json check (§7).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match versions.json "stellar_cli"; the digest is GitHub's published sha256 for the asset.
  STELLAR_CLI_VERSION: "28.1.0"
  STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-versions.mjs
      # DEC-051: the perps engine of record is frozen under lanes/perps/engine.
      - run: ./scripts/check-frozen.sh
      # M0.5: nothing under platform/ may depend on a lane (listed exceptions shrink to none).
      - run: node scripts/check-deps.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: stellar --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The frozen perps engine workspace (DEC-051): checked, never reformatted.
      - run: cargo fmt --all --manifest-path lanes/perps/engine/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --manifest-path lanes/perps/engine/Cargo.toml -- -D warnings
      # The parity tests load the Wasm of record, so build it first. This also
      # checks sizes and that the hashes match versions.json (INV-D7).
      - run: ./scripts/build-contracts.sh
      # The Wasm of record comes from this x86_64 Linux build (DEC-033): deploys
      # take these files, and they are kept for diffing when a hash differs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-wasm
          path: target/contracts/*.wasm
          if-no-files-found: ignore
      - run: cargo test --workspace --locked
      - name: Frozen perps engine tests (vectors, scenarios, properties)
        run: cargo test --workspace --locked --manifest-path lanes/perps/engine/Cargo.toml
      - name: Parity gate, 10,000 random blocks (INV-P5)
        run: cargo test --locked -p caravel-perps-node --test parity -- --ignored
      - name: Consensus crates build without std
        run: |
          cargo build --locked --manifest-path lanes/perps/engine/Cargo.toml -p caravel-types -p caravel-merkle -p caravel-perps --target wasm32v1-none
          cargo build --locked -p caravel-core --target wasm32v1-none

  apps:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [platform/relayer, lanes/perps/web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm --prefix ${{ matrix.app }} ci
      - run: npm --prefix ${{ matrix.app }} test
      - if: matrix.app == 'lanes/perps/web'
        run: npm --prefix lanes/perps/web run build

  # The local end-to-end (spec §19.5, T-011): quickstart in Docker, the lane
  # processes, steps 1-6. It needs a release build and a 2 GB image, so it runs
  # on main and on demand only, not on every pull request.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/e2e-local.sh

  # What the testnet VM runs (T-012, DEC-046): the node binary, the Wasm of
  # record (x86_64 Linux, DEC-033) and the relayer build, from one commit on
  # main. The VM runs Ubuntu 24.04 like this runner, so glibc matches.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Stellar CLI
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf stellar-cli.tar.gz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: ./scripts/build-contracts.sh
      - run: cargo build --release --locked -p caravel-node
      - run: npm --prefix platform/relayer ci && npm --prefix platform/relayer run build
      - run: npm --prefix lanes/perps/web ci && npm --prefix lanes/perps/web run build
      - name: Assemble the release
        run: |
          mkdir -p release/bin release/contracts release/relayer release/web
          cp -r lanes/perps/web/dist/. release/web/
          cp target/release/caravel-node release/bin/
          cp target/contracts/*.wasm release/contracts/
          cp -r platform/relayer/dist platform/relayer/package.json platform/relayer/package-lock.json release/relayer/
          (cd release && sha256sum bin/* contracts/* > SHA256SUMS && echo "${GITHUB_SHA}" > COMMIT)
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: caravel-release-linux-x86_64
          path: release/
