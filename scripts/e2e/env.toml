# The deployment scripts/e2e-local.sh runs, for any template: the e2e copies a
# template's lane file next to this one with `include = ["e2e-env.toml"]`,
# and sets these vars in a --var-file. Short timeouts, so the freeze in step 5
# comes within a minute (spec §24's drill uses the same idea).

[vars.network]
type = "string"
default = "local"

[vars.token]
type = "any"
default = { local = "USDC" }
description = "the settlement token: { local = \"CODE\" } or \"circle-usdc\""

[vars.port]
type = "integer"
default = 18080
description = "the sequencer's port; validator <n> listens on port + n"

[vars.validators]
type = "list"
default = ["1", "2", "3"]
description = "the validators' names; a rotation is --var 'validators=[\"1\",\"2\",\"4\"]'"

[vars.settlement_wasm]
type = "string"
default = ""
description = "pins a settlement build (a testnet run from this checkout's Wasm)"

[vars.feeds]
type = "list"
default = []
description = "the template's relayer feed modules"

[vars.feed_keys]
type = "map"
default = {}

[env.e2e]
network = "${var.network}"
admin = "admin"
token = "${var.token}"
threshold = 2
settlement_wasm = "${var.settlement_wasm == '' ? null : var.settlement_wasm}"
sequencer = { port = "${var.port}" }
validator_polling = { stellar_secs = 2 }
host = { provider = "local" }

[env.e2e.settlement_params]
force_inclusion_window_secs = 20
escape_timeout_secs = 30
min_rotation_delay_secs = 3600
signer_retention_epochs = 2

[env.e2e.validators]
for_each = "${var.validators}"
name = "${each.value}"
key = "validator-${each.value}"

[env.e2e.relayer]
account = "relayer"
intervals_ms = { inbox = 1000, checkpoints = 1000 }
feed_keys = "${var.feed_keys}"
feeds = "${var.feeds}"
