# The deployment scripts/soak-lane.sh runs (M0.9, F-02): the whole lane on a
# local Stellar network, sequencer, 3 validators and the relayer, under load.
# The soak makes a lane with `caravel init perps --prefix soak` (identities
# soak-<role>), includes this file and sets these vars in a --var-file. Unlike
# the e2e's, the settlement contract's timeouts are long: a soak runs for
# hours, and a checkpoint late under load must not make the lane freezable.

[vars.port]
type = "integer"
default = 19080
description = "the sequencer's port; validator <n> listens on port + n"

[vars.feeds]
type = "list"
default = []
description = "the template's relayer feed modules"

[vars.feed_keys]
type = "map"
default = {}

[env.soak]
network = "local"
admin = "soak-admin"
token = { local = "USDC" }
threshold = 2
sequencer = { port = "${var.port}" }
host = { provider = "local", runtime = "process" }

[env.soak.settlement_params]
force_inclusion_window_secs = 600
escape_timeout_secs = 3600
min_rotation_delay_secs = 3600
signer_retention_epochs = 2

[env.soak.validators]
for_each = ["1", "2", "3"]
name = "${each.value}"
key = "soak-v${each.value}"

[env.soak.relayer]
account = "soak-relayer"
feed_keys = "${var.feed_keys}"
feeds = "${var.feeds}"
