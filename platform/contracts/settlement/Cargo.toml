[package]
name = "settlement"
description = "Caravel settlement contract: USDC vault, inbox, checkpoints, withdrawals, freeze and escape"
# Built into a contract of record: its version stays put when the workspace
# version moves, because on x86_64 Linux a version change can reorder the
# Wasm (DEC-033, DEC-122). It changes with the contract.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
# The platform formats (DEC-052): the checkpoint header, inbox, preimages and Merkle.
caravel-core = { workspace = true, features = ["soroban"] }
# caravel-core builds its byte strings in Vecs.
soroban-sdk = { workspace = true, features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
caravel-core = { workspace = true, features = ["native", "soroban"] }
caravel-harness = { workspace = true }
caravel-app-sdk = { workspace = true, features = ["native", "testapp"] }
ed25519-dalek = { workspace = true }
serde_json = "1.0.151"
stellar-strkey = { workspace = true }
