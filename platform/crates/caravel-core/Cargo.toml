[package]
name = "caravel-core"
description = "Caravel platform formats for any lane: codecs, block, transaction and receipt framing, checkpoint header, inbox, state frame, Merkle (no_std)"
# Built into a contract of record: its version stays put when the workspace
# version moves, because on x86_64 Linux a version change can reorder the
# Wasm (DEC-033, DEC-122). It changes with the contract.
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# SHA-256 via `sha2`, for nodes and tests.
native = ["dep:sha2"]
# SHA-256 via the Soroban host (`env.crypto().sha256`), for contracts.
soroban = ["dep:soroban-sdk"]

[dependencies]
sha2 = { workspace = true, optional = true }
soroban-sdk = { workspace = true, optional = true }

[dev-dependencies]
caravel-core = { path = ".", features = ["native"] }
proptest = "1.11.0"
serde_json = "1.0.151"
