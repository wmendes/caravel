[package]
name = "caravel-deploy"
description = "Caravel deploy tool: a lane file's [env.<name>] deployments, planned against Stellar and the host, then applied (spec §20.3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
caravel-core = { workspace = true }
caravel-node = { workspace = true }
caravel-lanefile = { workspace = true }
caravel-runtime = { workspace = true }
stellar-xdr = { workspace = true, features = ["std"] }
stellar-strkey = { workspace = true }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
