[package]
name = "caravel-cli"
description = "caravel: the Caravel CLI, for any template's lanes (M0.6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "caravel"
path = "src/main.rs"

[dependencies]
caravel-deploy = { workspace = true }
caravel-node = { workspace = true }
caravel-runtime = { workspace = true }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
