[package]
name = "caravel-harness"
description = "Caravel test harness (test-only): a native lane on the app SDK, driven block by block, for platform tests such as the settlement contract's"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
caravel-core = { workspace = true, features = ["native"] }
caravel-app-sdk = { workspace = true, features = ["native", "testapp"] }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
