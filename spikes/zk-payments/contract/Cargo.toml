# Spike: settlement's check 7 as a validity proof. Holds the last header
# hash; `submit` checks the batch hash and the chain link, rebuilds the
# guest's journal and calls the RISC Zero verifier. Not the settlement contract.
[package]
name = "proven-checkpoint"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "=28.0.0" }

[dev-dependencies]
soroban-sdk = { version = "=28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
