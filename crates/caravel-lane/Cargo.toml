[package]
name = "caravel-lane"
description = "Caravel lane runtime: soroban-env-host executor, block and batch builders, store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
caravel-types = { workspace = true }
caravel-perps = { workspace = true, features = ["native"] }
# `testutils` provides the test host, contract registration and explicit
# per-call budget limits (DEC-027).
soroban-env-host = { workspace = true, features = ["testutils"] }
sha2 = { workspace = true }

[dev-dependencies]
caravel-testkit = { workspace = true }
caravel-types = { workspace = true, features = ["gen-vectors"] }
ed25519-dalek = { workspace = true }
serde_json = "1.0.151"
