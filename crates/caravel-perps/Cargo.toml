[package]
name = "caravel-perps"
description = "Caravel Perps deterministic engine logic (no_std + alloc)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `NativeCrypto` and `DiagnosticCrypto` (sha2 + ed25519-dalek verify_strict),
# for tests, sequencer pre-validation and the diagnostic re-run (spec §8.4, §14.1).
native = ["dep:sha2", "dep:ed25519-dalek"]

[dependencies]
caravel-types = { workspace = true }
caravel-merkle = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
caravel-testkit = { workspace = true }
proptest = "1.11.0"
serde_json = "1.0.151"
