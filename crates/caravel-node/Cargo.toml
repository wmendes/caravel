[package]
name = "caravel-node"
description = "Caravel node: sequencer, validator, replay, genesis and key tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "caravel-node"
path = "src/main.rs"

[dependencies]
caravel-types = { workspace = true }
caravel-perps = { workspace = true, features = ["native"] }
caravel-lane = { workspace = true }
stellar-strkey = { workspace = true }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
caravel-types = { workspace = true, features = ["gen-vectors"] }
caravel-merkle = { workspace = true, features = ["alloc", "native"] }
caravel-testkit = { workspace = true }
ed25519-dalek = { workspace = true }
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
