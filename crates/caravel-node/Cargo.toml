[package]
name = "caravel-node"
description = "Caravel node: sequencer, validator, replay, genesis and key tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "caravel-node"
path = "src/main.rs"

[dependencies]
caravel-types = { workspace = true }
caravel-perps = { workspace = true, features = ["native"] }
stellar-strkey = { workspace = true }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
caravel-types = { workspace = true, features = ["gen-vectors"] }
