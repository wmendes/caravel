[package]
name = "caravel-types"
description = "Caravel binary encodings, domain tags, reason and fatal codes, fixed-point helpers (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables the golden-vector generator (`cargo gen-vectors`, spec §19.2). It needs
# a hasher and a signer; the library itself never hashes or signs.
gen-vectors = ["dep:sha2", "dep:ed25519-dalek", "dep:caravel-merkle"]

[dependencies]
sha2 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
# Only for the generator, which also writes test-vectors/merkle.json.
caravel-merkle = { workspace = true, optional = true, features = ["gen-vectors"] }

[dev-dependencies]
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
proptest = "1.11.0"

[[bin]]
name = "gen-vectors"
path = "src/bin/gen-vectors.rs"
required-features = ["gen-vectors"]
