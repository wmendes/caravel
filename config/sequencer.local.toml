# Sequencer node config for a LOCAL lane (not consensus; spec §14). Paths are
# relative to this file. The internal API token is read from the environment
# variable named by internal_token_env, never from this file.
#
#   CARAVEL_INTERNAL_TOKEN=$(openssl rand -hex 16) \
#     cargo run --release -p caravel-node -- sequencer --config config/sequencer.local.toml

[sequencer]
listen = "127.0.0.1:8080"
lane = "lane.caravel-perps.local.toml"
engine_wasm = "../target/contracts/perps_engine.wasm"
engine_wasm_sha256 = "4571cd252d4b78d523d01fc4a31ab763a1aff77aecafbb9d7302cfb879abbf0a"
db = "../data/sequencer.sqlite"
network_passphrase = "Test SDF Network ; September 2015"
# The settlement contract this lane checkpoints to (a placeholder until one is deployed).
settlement_contract = "CADQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQOBYHA4DQP5KR"
internal_token_env = "CARAVEL_INTERNAL_TOKEN"
executor = "wasm"
production = false
cors_origins = ["http://localhost:5173"]

# The validator set the settlement contract holds (spec §13.4). Without it,
# checkpoints are sealed but never signed.
# [signers]
# epoch = 1
# threshold = 2
# validators = [
#   { url = "http://127.0.0.1:8081", key = "G..." },
#   { url = "http://127.0.0.1:8082", key = "G..." },
#   { url = "http://127.0.0.1:8083", key = "G..." },
# ]
